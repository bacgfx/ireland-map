html,body {margin:0; height:100%;height:100dvh;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
html {overscroll-behavior:none} body {overscroll-behavior:none} .folium-map {height:100dvh !important}
#trip-panel {position:fixed;z-index:1000;top:14px;left:14px;width:min(340px,calc(100vw - 28px));
 background:rgba(255,255,255,.97);color:#182b32;border:1px solid #d8e4e1;border-radius:15px;
 box-shadow:0 10px 35px rgba(21,41,41,.22);overflow:hidden;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
#trip-panel button,#trip-panel select,#trip-panel input{font:inherit}
.panel-head{padding:16px 18px 10px;background:#f4f8f5}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h1{font-size:20px;line-height:1.2;margin:0;color:#163b32}
.panel-head p{font-size:12px;color:#61756e;margin:6px 0 0}
#trip-toggle{border:1px solid #cbd8d3;background:white;border-radius:9px;padding:5px 9px;cursor:pointer}
.panel-body{padding:14px 18px;overflow-y:auto}
.control-label{display:block;color:#3d5650;font-weight:700;font-size:12px;margin:12px 0 7px}
#trip-search,#trip-category{box-sizing:border-box;width:100%;background:white;border:1px solid #ccd9d4;border-radius:8px;padding:10px;color:#1c3130}
.person-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person-option{display:flex;align-items:center;gap:7px;font-size:12px;background:#f4f7f5;border-radius:8px;padding:8px;cursor:pointer}
.person-option input{accent-color:#245e4b}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.stats{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid #e2eae6;margin-top:15px;padding-top:13px}
#trip-count{font-size:13px;font-weight:700}
.panel-actions{display:flex;gap:8px;margin-top:12px}
.panel-actions button{flex:1;padding:9px;border:1px solid #c9d8d1;background:#fff;border-radius:8px;cursor:pointer;color:#27463c}
.panel-actions button:hover{background:#edf5f0}
.small-note{font-size:11px;color:#6b7873;margin:12px 0 0;line-height:1.4}
.trip-popup{width:260px;max-width:calc(100vw - 90px);color:#273735}
.trip-popup img{display:block;width:100%;height:145px;object-fit:cover;border-radius:7px;background:#e5eae7}
.trip-popup h3{margin:10px 0 3px;font-size:17px;line-height:1.2}
.trip-meta{font-size:12px;color:#5a7067;margin:0 0 8px}
.trip-pills{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.trip-pill{font-size:11px;background:#eef3ef;border-radius:12px;padding:4px 7px;color:#375349}
.trip-description{font-size:13px;line-height:1.45;margin:8px 0}
.trip-popup a{color:#176b80;text-decoration:underline}
.trip-photo-fallback{display:block;font-size:12px;padding:8px 0;color:#51665f}
.pin{width:17px;height:17px;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 6px #0007}
.leaflet-popup-content{margin:13px}
#trip-panel.collapsed .panel-body{display:none}
#trip-panel.collapsed .panel-head p{display:none}
#trip-panel.collapsed .panel-head{padding:11px 14px}
#trip-panel.collapsed .panel-head h1{font-size:17px}
#trip-panel button:focus-visible,#trip-panel input:focus-visible,#trip-panel select:focus-visible{outline:3px solid #448ed8;outline-offset:2px}
@media(max-width:600px){
  #trip-panel{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:calc(100vw - 16px);max-height:min(78dvh,700px);border-radius:12px}
  .panel-head{padding:12px 14px 10px}.panel-head h1{font-size:18px}.panel-body{padding:8px 14px 15px;overscroll-behavior:contain}
  #trip-toggle{min-height:40px;min-width:44px;font-size:22px;line-height:1}
  #trip-search,#trip-category{min-height:44px;font-size:16px}
  .person-option{min-height:35px;padding:8px;font-size:13px}
  .person-option input{height:18px;width:18px;flex-shrink:0}
  .panel-actions button{min-height:44px;font-size:14px}
  #trip-panel.collapsed{width:auto;max-width:calc(100vw - 16px)}
  #trip-panel.collapsed .panel-head{padding:8px 10px 8px 13px}
  #trip-panel.collapsed .panel-top{gap:16px}
  .leaflet-top.leaflet-left{top:calc(env(safe-area-inset-top,0px) + 65px)}
  .leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top,0px) + 65px)}
  .leaflet-bottom.leaflet-left,.leaflet-bottom.leaflet-right{bottom:env(safe-area-inset-bottom,0px)}
  .leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:22px!important}
  .leaflet-popup-content{margin:10px}
  .trip-popup{width:min(270px,calc(100vw - 95px));max-width:calc(100vw - 95px);max-height:55dvh;overflow-y:auto}
  .trip-popup img{height:145px}
  .trip-popup h3{font-size:16px}
  .trip-description{font-size:13px}
}

pe%2C%20Galway%20City.jpg"}, {"id": 6, "name": "Rugby Game at Aviva Stadium", "county": "Dublin", "categories": ["Activity", "Sports"], "ben": true, "cass": true, "person": "both", "description": "Thomond Park, Aviva Stadium, Galway Sportsground or Kingspan Stadium also have rugby matches", "pages": "42", "coordinates": [53.33444183216335, -6.227642294606862], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Aviva%20Stadium%20Dublin.jpg?width=600"}, {"id": 7, "name": "Hurling Game at Croke Park", "county": "Dublin", "categories": ["Activity", "Sports"], "ben": true, "cass": false, "person": "ben", "description": "Hurling combines aspects of hockey, lacrosse, and baseball, and can trace its origins back to prehistoric times", "pages": "42", "coordinates": [53.36094625547298, -6.251037642496284], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Croke%20Park.jpg?width=600"}, {"id": 8, "name": "English Market", "county": "Cork", "categories": ["Food Market"], "ben": true, "cass": false, "person": "ben", "description": "A covered fruit and veg market established in 1610, this is one of the oldest municipal markets in the world", "pages": "44", "coordinates": [51.89780912092893, -8.475068402094802], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/English%20Market.jpg?width=600"}, {"id": 9, "name": "Fallon and Byrne's Food Hall", "county": "Dublin", "categories": ["Food Market", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "Bountiful food hall with a candlelit wine bar in the basement", "pages": "59", "coordinates": [53.34321177504751, -6.26328664837519], "image": "https://www.irishtimes.com/resizer/v2/5TZX64SCFABBHOJ62HCUUWVPUQ.jpg?auth=4751ac10e00c1c61c8c652e7497122b1630ff1438512272b50ea72da5d47cd74\u0026height=576\u0026smart=true\u0026width=1024"}, {"id": 10, "name": "Chapter One", "county": "Dublin", "categories": ["Restaurant"], "ben": false, "cass": true, "person": "cass", "description": "Two Michelin- d a lake, the green is dotted with memorials to eminent Dubliners", "pages": "73", "coordinates": [53.338272844065045, -6.258400405407452], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/St%20Stephen's%20Green.jpg?width=600"}, {"id": 14, "name": "Little Museum of Dublin", "county": "Dublin", "categories": ["Museum", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "Described as \"Dublin's best museum experience\", housed in a beautiful Georgian building on St Stephen's Green. It charts the cultural, social and political history of the capital. On certain days, there's an after-hours tour that includes a glass of wine and a walking tour of Stephen's Green is also offered daily", "pages": "73", "coordinates": [53.33971844264593, -6.257964019733772], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The%20Little%20Museum%20of%20Dublin.jpg?width=600"}, {"id": 15, "name": "Merrion Square", "county": "Dublin", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "One of Dublin's largest and grandest Georgian squares laid out in 1762", "pages": "74", "coordinates": [53.33978747768994, -6.248644773697436], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Merrion%20Square%2C%20Dublin%2C%20Ireland.jpg?width=600"}, {"id": 16, "name": "Iveagh Gardens", "county": "Dublin", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "Originally part of the Dublin Exhibition Palace grounds. Today, they offer a peaceful retreat with sunken lawns, whimsical grottos, a maze, and an elegant rosarium", "pages": "74", "coordinates": [53.33522726382881, -6.260562233224988], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Iveagh%20Gardens%2C%20Dublin%20City%20Park.jpg?width=600"}, {"id": 17, "name": "Dublin Castle", "county": "Dublin", "categories": ["Castle"], "ben": true, "cass": true, "person": "both", "description": "Built on the site of a Viking fortress in the 13th century and reamined the seat of English rule here for seven centuries. Today the castle is both a key visitor attraction and a government complex", "pages": "82", "coordinates": [53.343039801169205, -6.267374757842445], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Dublin%20Castle.jpg?width=600"}, {"id": 18, "name": "Temple Bar", "county": "Dublin", "categories": ["Bar", "Drink", "Shop"], "ben": true, "cass": true, "person": "both", "description": "Today is a mix of galleries and theatres alongside kitsch tourist pubs, souvenir shops, fast-food restaurants and nightclubs", "pages": "87", "coordinates": [53.34553526413437, -6.263634664112079], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The%20Temple%20Bar%2C%20Dublin.jpg?width=600"}, {"id": 19, "name": "Il Vanentino", "county": "Dublin", "categories": ["Restaurant"], "ben": false, "cass": true, "person": "cass", "description": "Great brunches, savoury dishes and a magnificent array of homemade cakes can be enjoyed at this quaint Dublin institution", "pages": "88", "coordinates": [53.34266871563311, -6.2382686123157045], "image": "https://dynamic-media-cdn.tripadvisor.com/media/photo-o/18/3e/c6/b1/man-kann-drinnen-oder.jpg?h=1200\u0026s=1\u0026w=1200"}, {"id": 20, "name": "St Patrick's Cathedral", "county": "Dublin", "categories": ["Landmark", "Church"], "ben": true, "cass": true, "person": "both", "description": "Ireland's largest church was founded beside a sacred well where St Patrick is said to have baptized converts around 450 CE. Much of the present building dates back to work completed between 1254 and 1270", "pages": "90", "coordinates": [53.339489748727715, -6.270993904388358], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/St%20Patrick's%20Cathedral%20Dublin.jpg?width=600"}, {"id": 21, "name": "Jameson Distillery", "county": "Dublin", "categories": ["Activity", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "Based in the heart of Smithfield and offers first-rate tours and whiskey tastings. Visit starts with a video, before a 40-minute tour filled with plenty of whiskey-related facts", "pages": "100", "coordinates": [53.34829395010517, -6.276406629515367], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Dublin%20-%20Old%20Jameson%20Distillery%20-%2020210918161608.jpg?width=600"}, {"id": 22, "name": "Dingle Whiskey", "county": "Kerry", "categories": ["Activity", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "A small, independent distillery on the west coast, representing the new wave of Irish whiskey production", "pages": "101", "coordinates": [52.14190802196889, -10.288497413589155], "image": "https://www.thespiritsbusiness.com/content/uploads/2020/09/Dingle-Distillery.jpg"}, {"id": 23, "name": "O'Connell Street", "county": "Dublin", "categories": ["Shop", "Restaurant"], "ben": false, "cass": true, "person": "cass", "description": "Since the 1960s, many of the old buildings have been replaced by the glass and neon of fast-food joints and chain stores", "pages": "102", "coordinates": [53.34890307553904, -6.258631376095415], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/O'Connell%20Street.jpg?width=600"}, {"id": 24, "name": "The Hungry Tree", "county": "Dublin", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "When wandering the grounds of King's Inns, look out for this London plane tree ingesting a nearby bench. Dating from the 19th century, it is now a listed tree and shows no signs of giving up the unfortunate seat", "pages": "104", "coordinates": [53.35224834799227, -6.272159364424407], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Hungry%20Tree%20at%20King%E2%80%99s%20Inns%2C%20Dublin-12930574313.jpg?width=600"}, {"id": 25, "name": "The Cobblestone", "county": "Dublin", "categories": ["Bar", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "One of Dublin's best-loved pubs, popular with visitors and locals alike. It's a cosy spot with a welcoming bar and a long-standing repuration for excellent live trad music", "pages": "105", "coordinates": [53.350064445188615, -6.27684904907908], "image": "https://d2vbr83hnyiux1.cloudfront.net/image/975050285728/image_ko9preoph91qvfcaafbcgnha76/-FWEBP"}, {"id": 26, "name": "The Winding Stair", "county": "Dublin", "categories": ["Restaurant", "Books"], "ben": true, "cass": false, "person": "ben", "description": "Overlooking the Ha'penny Bridge, this charming restaurant is the upper half of one of Dublin's oldest bookshops. Expect wholesome Irish cooking with an artisanal touch", "pages": "106", "coordinates": [53.34697410223652, -6.263031744860766], "image": "https://media.cntraveler.com/photos/5df90b09a6574e0008a09bd3/16%3A9/w_2560%2Cc_limit/TheWindingStair-Dublin-2019-BHKD9H.jpg"}, {"id": 27, "name": "The Irish Emigration Museum", "county": "Dublin", "categories": ["Museum"], "ben": true, "cass": false, "person": "ben", "description": "From the Great Famine to the 2008 financial crash, the history of Ireland has long been punctuated by emigration. Through 20 themed galleries, this interactive museum in Dublin's docklands explores why people left, how they influenced the world they found, and the connection to their descendants in Ireland today", "pages": "106", "coordinates": [53.3484596770634, -6.2472456932610045], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/EPIC%20Irish%20Emigration%20Museum%20Dublin.jpg?width=600"}, {"id": 28, "name": "St Michan's Church", "county": "Dublin", "categories": ["Landmark", "Church", "Museum"], "ben": false, "cass": true, "person": "cass", "description": "Largely rebuilt in 1685 on the site of an 11th-century Hiberno-Viking church, the dull facade hides a more exciting interior. Deep in its vaults lie a number of bodies (and skulls) preserved because of the dry atmosphere created by the church's magnesian limestone walls", "pages": "106", "coordinates": [53.34764087520353, -6.274955282969668], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Dublin%20-%20St.%20Michan's%20Church%20-%2020230614115249.jpg?width=600"}, {"id": 29, "name": "Phoenix Park/Dublin Zoo", "county": "Dublin", "categories": ["Activity", "Animals"], "ben": true, "cass": true, "person": "both", "description": "Europe's largest enclosed city park came into being in 1662. Includes the Dublin Zoo", "pages": "112", "coordinates": [53.357300010955, -6.306358083478474], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Phoenix%20Park%20is%20an%20urban%20park%20in%20Dublin%2C%20Ireland%20(5488987575).jpg?width=600"}, {"id": 30, "name": "Guinness Storehouse", "county": "Dublin", "categories": ["Activity", "Drink"], "ben": true, "cass": true, "person": "both", "description": "The first impression the visitor has is of walking into a large glass pint, with light spilling down from above", "pages": "114", "coordinates": [53.341789555653655, -6.2861468736975405], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Guinness%20Storehouse%2C%20Dublin.JPG?width=600"}, {"id": 31, "name": "Irish Museum of Modern Art", "county": "Dublin", "categories": ["Museum"], "ben": true, "cass": true, "person": "both", "description": "Ireland's finest surviving 17th-century propertym built in 1684.The displays are usually temporary shows, mixed with a small permanent collection that includes heavyweights such as Marina Abramovic", "pages": "116", "coordinates": [53.34287664234906, -6.299434673697408], "image": "https://images.ireland.com/media/Images/plan-your-trip/trip-ideas/24-hours-in-dublin/43164f68658d4a44b7db2491fac99c53.jpg?w=1934"}, {"id": 32, "name": "Forbidden Fruit Festival", "county": "Dublin", "categories": ["Activity"], "ben": true, "cass": false, "person": "ben", "description": "Music and arts festival began in 2011 is held every June Bank Holiday in Royal Hospital Kilmainham's impressive grounds are transformed into a playground", "pages": "117", "coordinates": [53.34304641172283, -6.299459885774836], "image": "https://assets-eu-01.kc-usercontent.com/aa24ba70-9a12-01ae-259b-7ef588a0b2ef/3e1c434b-70ff-4576-a04a-1f2734e15438/b3da682e-d5a5-440a-9cf6-f026da0ea3ae.jpg?fit=crop\u0026fm=jpg\u0026h=750\u0026q=66\u0026w=1332"}, {"id": 33, "name": "Kilmainham Gaol", "county": "Dublin", "categories": ["Museum", "Landmark"], "ben": false, "cass": true, "person": "cass", "description": "During its 128 years as a jail that opened in 1796 it housed many of those involved in fight for Irish independence. Visits are by guided tour only include the chapel, prison yard, cells", "pages": "118", "coordinates": [53.34187026731458, -6.3084657973620475], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Kilmainham%20Gaol%20Prison.jpg?width=600"}, {"id": 34, "name": "National Botanic Gardens", "county": "Dublin", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "Opened in 1795, they are Ireland's foremost centre of botany and horticulture. The park containts over 16,000 different plant species", "pages": "119", "coordinates": [53.37264528606035, -6.270726830023618], "image": "https://content.speakup.it/medio/2025/05/05/the-national-botanic-gardens-in-dublin-ireland_c8af8a60_250505110051_1200x630.jpg"}, {"id": 35, "name": "Malahide Castle", "county": "Dublin", "categories": ["Castle"], "ben": true, "cass": false, "person": "ben", "description": "The castle's core dates from the 12th century but later additionas have given it a classic fairy-tale appearance. The guided tour takes you round the castle's collection of 18th-century Irish furniture, the oak-beamed Great Hall and the impressively carved Oak Room", "pages": "120", "coordinates": [53.44474281447963, -6.16506609089224], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Malahide-Castle.jpg?width=600"}, {"id": 36, "name": "Howth/Ireland's Eye", "county": "Dublin", "categories": ["Nature", "Location", "Animals"], "ben": true, "cass": true, "person": "both", "description": "Commrecial fishing town has lovely views of the bay. Ireland's eye, an islet and bird sanctuary whre puffins nest can be reached by a short boat trip from Howth", "pages": "121", "coordinates": [53.406309022192666, -6.063069240189425], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Howth%20-%20distant%20view%20of%20Howth%20Harbour%20and%20Ireland's%20Eye%20from%20the%20cliffs.jpg?width=600"}, {"id": 37, "name": "Killiney", "county": "Dublin", "categories": ["Nature", "Beach"], "ben": true, "cass": true, "person": "both", "description": "The route offers one of the most scenic vistas on this stretch of the east coast. Another exhilirating view can be seen from the top of Killiney Hill Park, off Victoria Road. Down below is the popular pebbly beach, Killiney Strand", "pages": "121", "coordinates": [53.265507012449724, -6.110598471846582], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Bray%20and%20Environs%20from%20Killiney%20Hill.jpg?width=600"}, {"id": 38, "name": "Teddy's Ice Cream", "county": "Dublin", "categories": ["Food"], "ben": false, "cass": true, "person": "cass", "description": "This seaside shop has barely changed since it opened in the 1950s. Nostalgia aside, the creamy cones draw crowds of locals and tourists alike", "pages": "121", "coordinates": [53.29062687680056, -6.126880714172663], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Dun%20Laoghaire%20-%20Teddys%20For%20The%20Best%20ice%20Cream%20(5840518534)%20(7).jpg?width=600"}, {"id": 39, "name": "Johnnie Fox's", "county": "Dublin", "categories": ["Bar", "Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "Situated in the Dublin Mountains with live traditional music, an award-winning seafood menu and open turf fires, this is more of an attraction than a pub", "pages": "121", "coordinates": [53.22185442559022, -6.218365927667095], "image": "https://www.irishcentral.com/uploads/assets-v2/2026/4/MI_Johnnie_Fox_s_Dublin_via_Tourism_Ireland.jpg"}, {"id": 40, "name": "Upper Lake in Glendalough Valley", "county": "Wicklow", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "Pretty", "pages": "128", "coordinates": [53.00411817609323, -6.360633536023868], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Glendalough%20Upper%20Lake.jpg?width=600"}, {"id": 41, "name": "La Cote", "county": "Wexford", "categories": ["Restaurant"], "ben": false, "cass": true, "person": "cass", "description": "Great choice for dinner, serving fresh seafood right on the harbour. You'll have a view of the Atlnatic and the local mussel trawlers while you eat", "pages": "129", "coordinates": [52.3390087969071, -6.459153173746492], "image": "https://images.fivestar.ie/eyJidWNrZXQiOiJzdGF0aWMuZml2ZXN0YXIuaWUiLCJrZXkiOiJ2ZW51ZXNcLzZcLzFcLzYxODMxXC9zdWJwYWdlXC9waG90b3NcLzE2MjEzNDYyMjMtMDU4LmpwZyIsImVkaXRzIjp7InJlc2l6ZSI6eyJ3aWR0aCI6ODYwLCJoZWlnaHQiOjYwMCwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfX19"}, {"id": 42, "name": "Anglo-Norman Castle (Enniscorthy)", "county": "Wexford", "categories": ["Castle"], "ben": true, "cass": false, "person": "ben", "description": "One of the only castles in Ireland to allow visitors onto the roof. Glorious view from the 12th century", "pages": "129", "coordinates": [52.50149989608822, -6.567196971702811], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/EnniscorthyCastle.jpg?width=600"}, {"id": 43, "name": "Blaa Blaa Blaa Sandwiches", "county": "Kilkenny", "categories": ["Restaurant"], "ben": false, "cass": true, "person": "cass", "description": "Local shop with fresh ingredients and generous servings", "pages": "129", "coordinates": [52.651786353710044, -7.250518062741129], "image": "https://excellentstreetimages.com/PubsAndRestaurantsPWA/files/blaablaablaacafeinkilkennyjuly2021.jpg"}, {"id": 44, "name": "Powerscourt Estate", "county": "Wicklow", "categories": ["Landmark", "Nature"], "ben": false, "cass": true, "person": "cass", "description": "The 68-room Palladian mansion is stunning, but the manicured gardens, probably the finest in Ireland, are the real draw", "pages": "132", "coordinates": [53.186586169030974, -6.184585927443457], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Powerscourt%20Estate%20Front%2C%20Co.%20Wicklow%2C%20Ireland%202012.jpg?width=600"}, {"id": 45, "name": "Kilkenny Castle", "county": "Kilkenny", "categories": ["Castle"], "ben": true, "cass": true, "person": "both", "description": "Overlooks the River Nore, this Norman fortress is one of Ireland's most famous castles. It was built in the 1190s", "pages": "138", "coordinates": [52.65059985933665, -7.248578570022238], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/KilkennyCastle.jpg?width=600"}, {"id": 46, "name": "St Canice's Cathedral", "county": "Kilkenny", "categories": ["Landmark", "Church"], "ben": true, "cass": true, "person": "both", "description": "The hilltop cathedral was built in the 13th century in an early English gothic style. The round tower is the oldest standing structure in Kilkenny, thought to date from the mid-9th century", "pages": "138", "coordinates": [52.656857423788296, -7.256792289076338], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Kilkenny%20St%20Canice's%20Cathedral.jpg?width=600"}, {"id": 47, "name": "Kilkenny Design Centre", "county": "Kilkenny", "categories": ["Shop", "Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "Sprawling shop is packed with handcrafted Irish pieces, offering a selection of jewelry, knitwear, china, pottery, and glass. There is also a restuarant and food hall", "pages": "139", "coordinates": [52.649993879266155, -7.248716695149645], "image": "https://www.kilkennyarts.ie/content/images/_1148x1100_fit_center-center_95_none/48468/DCCI-Front.jpg?v=1771344905"}, {"id": 48, "name": "House of Waterford Crystal", "county": "Waterford", "categories": ["Activity"], "ben": true, "cass": false, "person": "ben", "description": "Learn about and observe the process of crystal-making. Original glass factory was founded in 1783 by two brothers", "pages": "141", "coordinates": [52.2594306798491, -7.105847622150524], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Waterford%20Crystal%20Showroom%20and%20Factory%20-%20geograph.org.uk%20-%203652064.jpg?width=600"}, {"id": 49, "name": "The Book Centre", "county": "Waterford", "categories": ["Shop", "Books"], "ben": false, "cass": true, "person": "cass", "description": "Browse the shelves of this unique bookshop, housed in a 1930s Art Deco cinema with the original screen still visible", "pages": "141", "coordinates": [52.2609078081761, -7.111197095168587], "image": "https://www.irishtimes.com/resizer/v2/Q3MAF6SNPIJBUTP6VYLYVNVNOQ.jpg?auth=6d60bc4addaf5a34211a4685cf5b222469b89559338540df37f4f22df35c552d\u0026height=810\u0026smart=true\u0026width=1440"}, {"id": 50, "name": "St Brigid's Cathedral", "county": "Kildare", "categories": ["Landmark", "Church"], "ben": false, "cass": true, "person": "cass", "description": "Commemorates the saint who founded a religious community on this site in 480 CE", "pages": "142", "coordinates": [53.15805973233364, -6.910658656506509], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Kildare%20Cathedral%20-%20aerial%20-%202025-06-29.jpg?width=600"}, {"id": 51, "name": "Bray", "county": "Wicklow", "categories": ["Location", "Shop", "Activity"], "ben": true, "cass": false, "person": "ben", "description": "Once a refined Victorian resort, Bray is nowadays a brash holiday town, with amusement arcades and fish-and-chip shops lining the seafront. Its beach attracts large crowds in summer", "pages": "144", "coordinates": [53.20133713357622, -6.111255147086913], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Bray%20beach%20and%20Bray%20Head%20-%20geograph.org.uk%20-%205574111.jpg?width=600"}, {"id": 52, "name": "Wicklow Mountains", "county": "Wicklow", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "Colorful and remote moorlands. Further north, the River Vartry rushes through the deep chasm of the Devil's Glen. On entering the valley, the river falls 100ft into a pool known as the Devil's Punchbowl", "pages": "146", "coordinates": [53.14312907331866, -6.310116839307266], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Ballinastoe%20Peak%20with%20Lough%20Tay%20Wicklow%20Mountains.jpg?width=600"}, {"id": 53, "name": "Avoca Handweavers", "county": "Wicklow", "categories": ["Shop", "Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "Avoca has long been the go-to for luxury Irish products, and this store has a garden setting. Grab a bite to eat at the cafe before browsing the food market and homewares section", "pages": "147", "coordinates": [52.86124477530613, -6.210288406775785], "image": "https://avoca.com/cdn/shop/files/OUR-MILL_Banner.jpg?v=1771247923\u0026width=1500"}, {"id": 54, "name": "Powerscourt Waterfall", "county": "Wicklow", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "At 397ft is Ireland's highest waterfall", "pages": "147", "coordinates": [53.146212205092, -6.2102183625800205], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/521%20Powerscourt%20Waterfall%2C%20County%20Wicklow.jpg?width=600"}, {"id": 55, "name": "Jerpoint Abbey", "county": "Kilkenny", "categories": ["Landmark"], "ben": false, "cass": true, "person": "cass", "description": "One of the finest Cistercian ruins in Ireland. Founded in 1160, the fortified medieval complex rivalled Duiske Abbey in prestige. There are amusing scupltures of knights, courtly ladies, bishops, and dragons", "pages": "149", "coordinates": [52.51094749905775, -7.15537636710124], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/County%20Kilkenny%20Jerpoint%20Abbey%20Exteriors%20East%20Side%201.jpg?width=600"}, {"id": 56, "name": "Saltee Islands", "county": "Wexford", "categories": ["Nature", "Islands"], "ben": true, "cass": true, "person": "both", "description": "These islands off the south coast of Wexford are a haven for sea birds. Great and Little Saltee together form Ireland's largest bird sanctuary, and are very popular with bird-watchers. The islands nurture and impressive array, from gannets and gulls to puffins and Manx shearwaters. There is also a colony of 100 grey seals. Boat trips are run in fine weather from Kilmore Quay, leaving in late morning and returning mid-afternoon", "pages": "152", "coordinates": [52.1187485062581, -6.612437600988019], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Saltees%20Islands.jpg?width=600"}, {"id": 57, "name": "Johnstown Castle", "county": "Wexford", "categories": ["Castle", "Activity"], "ben": true, "cass": false, "person": "ben", "description": "A splendid Gothic Revival mansion, lies amid gardens and woodland 4 miles southwest of Wexford. There is an excellent exhibition on the Famine, which puts this nationala tragedy of the 1840s in perspective, explaining the role of the potato and the changes that followed in the wake of the disastrous blight", "pages": "153", "coordinates": [52.29386645141452, -6.499025552434509], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Johnstown%20Castle%2C%20Wexford.jpg?width=600"}, {"id": 58, "name": "Paul Street", "county": "Cork", "categories": ["Location", "Restaurant", "Bar", "Drink", "Shop"], "ben": true, "cass": true, "person": "both", "description": "Notes for its cool restaurants, chic bars, bookshops and trendy boutiques, Paul Street is the hub of the liveliest district in town", "pages": "160", "coordinates": [51.89971391475415, -8.474190919803847], "image": "https://www.echolive.ie/cms_media/module_img/10125/5062715_2_articlelarge_1687795.jpg"}, {"id": 59, "name": "Blackrock Castle Observatory", "county": "Cork", "categories": ["Castle"], "ben": true, "cass": false, "person": "ben", "description": "Built in 1582 by Lord Mountjoy as a harbour fortification, the castle was reconstructed in 1829 following a fire that broke out two years earlier", "pages": "161", "coordinates": [51.90011813275723, -8.402148802604048], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Blackrock%20Castle%20Cork.jpg?width=600"}, {"id": 60, "name": "Skellig Islands (Skellig Michael)", "county": "Kerry", "categories": ["Nature", "Islands", "Animals"], "ben": true, "cass": true, "person": "both", "description": "Also known as Great Skellig, this is one of the most stunning places to visit in the whole of Ireland. Monks setlled here for solitude during the 6th century, building a cluster of stone beehive huts and two boat-shaped oratories, all of which are still standing. Little Skellig is a bird sanctuary to a variety of sea birds and no landing is permitted. Eco tours circle the islands, focusing on their wildlife. Larger wildlife such as basking sharks, dolphins, seals and turtles, may also be seen in the waters around the islands", "pages": "162-163", "coordinates": [51.77562119378809, -10.52458901908952], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Skellig%20Michael.jpg?width=600"}, {"id": 61, "name": "Lakes of Killarney (Ladies' View)", "county": "Kerry", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "Renowned for its scenery, this is one of Ireland's most popular attractions. The three lakes - Upper, Leane and Muckross - are contained within Killarney National Park, and make up around a quarter of the park's area", "pages": "164", "coordinates": [52.02086536186011, -9.508138205854213], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Lakes%20of%20Killarney.JPG?width=600"}, {"id": 62, "name": "Listowel", "county": "Kerry", "categories": ["Location"], "ben": false, "cass": true, "person": "cass", "description": "This charming market town, with its formal Georgian square and ivy-clad buildings lining the streets, offers a tranquil escape from the hustle and bustle of city life", "pages": "168", "coordinates": [52.44596826393711, -9.484572720096747], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Centre%20of%20Listowel%20-%20geograph.org.uk%20-%206096430.jpg?width=600"}, {"id": 63, "name": "Dingle", "county": "Kerry", "categories": ["Location", "Restaurant", "Shop"], "ben": true, "cass": true, "person": "both", "description": "This once remote Irish-speaking town, which started out as the site of a fort and trading post, is today a thriving fishing port and popular tourist centre. Brightly painted craft shops and cafes abound, often with slightly hippy overtones. Sea creatures can be seen at Oceanworld Aquarium, one of Ireland's foremost aquariums with underwater tunnels that bring visitors face to face with the local sea life. Dingle is the starting point for harbour tours to see marine wildlife", "pages": "169", "coordinates": [52.14082786866719, -10.267066503572035], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Dingle-1012734%2C%20Co.%20Kerry%2C%20Ireland.jpg?width=600"}, {"id": 64, "name": "Valentia Island", "county": "Kerry", "categories": ["Nature", "Islands"], "ben": true, "cass": false, "person": "ben", "description": "Widely known for its beautiful seascapes, engaging watersports and stunning archaelogical sites", "pages": "170", "coordinates": [51.91037165246569, -10.35439195251333], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Valentia%20Island%20Panorama.jpg?width=600"}, {"id": 65, "name": "Garnish Island", "county": "Cork", "categories": ["Nature", "Islands"], "ben": true, "cass": false, "person": "ben", "description": "Located in the harbour of Glengarriff, was turned into a beautiful garden in 1910. An added attraction of the boat trip across to this Gulf Stream paradise is the chance to see seals basking on the rocks and cavorting in Bantry Bay", "pages": "171", "coordinates": [51.736658520770085, -9.54315955792068], "image": "https://www.irishexaminer.com/cms_media/module_img/4801/2400635_18_articleinline_Garnish_Island_Web_Size.jpg"}, {"id": 66, "name": "Mizen Head", "county": "Cork", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "The most southwesternly tip of Ireland, has steep cliffs, often lashed by storms", "pages": "172", "coordinates": [51.457727508764194, -9.797464706536331], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Mizen%20Head.JPG?width=600"}, {"id": 67, "name": "Rolf's", "county": "Cork", "categories": ["Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "This fine-dining restaurant overlooking Roaringwater Bay serves fresh local produce and home-baked breads, desserts and pastries", "pages": "173", "coordinates": [51.47994879586559, -9.366714168333502], "image": "https://media-cdn.tripadvisor.com/media/photo-s/05/4c/30/f1/rolfs-country-house.jpg"}, {"id": 68, "name": "De Barra's Folk Club", "county": "Cork", "categories": ["Bar", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "This is one of West Cork's best-known pubs, with instruments lining the walls and a traditional folk club. Although it regularly hosts prominent bands, De Barra's remains true to its lowkey roots", "pages": "174", "coordinates": [51.62307289389958, -8.88854244581898], "image": "https://www.sportoutdoor24.it/app/uploads/2025/07/De-Barra-Pub-Clonakilty-Co-Cork.jpg"}, {"id": 69, "name": "Blarney Castle", "county": "Cork", "categories": ["Castle", "Activity"], "ben": true, "cass": true, "person": "both", "description": "Visitors from around the world flock to this ruined castle considered one of Ireland's greatest treasures to kiss the legendary Blarney Stone. Kissing the stone, which is set in the wall below the castle attlements and reached by climbing to the top of a steep staircase, is a long-standing tradition; according to legend, it confers a magical eloquence. Blarney has a pretty village green with welcoming pubs and some craft shops. It is also home to the Blarney Woollen Mills, which sells garments and souvenirs", "pages": "174", "coordinates": [51.929191408635354, -8.571410415074666], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Blarney%20Castle%20Tower.jpg?width=600"}, {"id": 70, "name": "Jameson Distillery Middleton", "county": "Cork", "categories": ["Activity", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "A sensitively restored 18th- century distileery, Jameson distillery is part of the vast Irish Distillers group. The story of Irish whiskey is presented through audio-visual displays, working models and original machinery", "pages": "175", "coordinates": [51.91336568862564, -8.168704600748926], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Jameson%20Distillery%20in%20Midleton%2C%202016.jpg?width=600"}, {"id": 71, "name": "River Blackwater", "county": "Cork", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "The second-longest river in Irealnd after the Shannon, the Blackwater rises in high bogland in County Kerry. The best way to see the valley is to take the scenic Blackwater Valley Drive from Youghal to Mallow", "pages": "176", "coordinates": [52.13260267747184, -8.623483706150253], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Blackwater%20River%20-%20geograph.org.uk%20-%2014612.jpg?width=600"}, {"id": 72, "name": "Kinsale/International Museum of Wine", "county": "Cork", "categories": ["Location", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "Kinsale, with its yacht-filled harbour and narrow medieval streets, is one of the prettiest towns on Ireland's southwest coast. The castle also houses the International Museum of Wine, which focuses on Kinsale's links to Ireland's wine trade and charts the journeys of the Irish people who left for France, Spain and California", "pages": "177", "coordinates": [51.70600724620002, -8.522059114065001], "image": "https://storage.ghost.io/c/4a/e7/4ae734df-56b6-4aa1-8dd1-dce3c399fce4/content/images/2025/05/Kinsale-Harbour-Aerial-Co-Cork_Web-Size.jpg"}, {"id": 73, "name": "Dingle Peninsula", "county": "Kerry", "categories": ["Nature", "Location"], "ben": false, "cass": true, "person": "cass", "description": "Offers some of Ireland's most beautiful scenery and is home to Pairc Naisiunta na Mara, Ciarrai, the country's first marine National Park", "pages": "180", "coordinates": [52.2755872763478, -10.231408500731211], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/689%20Dingle%20Peninsula%2C%20County%20Kerry.jpg?width=600"}, {"id": 74, "name": "The Ring of Kerry", "county": "Kerry", "categories": ["Nature", "Location"], "ben": false, "cass": true, "person": "cass", "description": "This long-established route around the Iveragh Peninsula, which can be taken in either direction, is always referred to as the Ring of Kerry", "pages": "182", "coordinates": [51.84541755925505, -9.874955848822214], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Ring%20of%20Kerry%2C%20Ireland.jpg?width=600"}, {"id": 75, "name": "The Burren", "county": "Clare", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "An astonishing array of wildflowers adds splashes of colour to the austere landscape, taking root in the crevices of the limestone pavements that are the most striking geological feature of the rocky plateau", "pages": "188", "coordinates": [53.06969086026132, -9.353931004401636], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The%20Burren%2CCo.%20Clare%2C%20Ireland.jpg?width=600"}, {"id": 76, "name": "Cliffs of Moher", "county": "Clare", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "Ireland's most visited natural attraction, the Cliffs of Moher are nothing short of majestic. These completely vertical sea cliffs jut out into the blustery Atlantic, creating a dramatic stretch along the country's west coast", "pages": "190", "coordinates": [52.971871777207525, -9.428779581576032], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/TheCliffs%20of%20Moher.jpg?width=600"}, {"id": 77, "name": "Bunratty Castle and Folk Park", "county": "Clare", "categories": ["Castle", "Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "Outside of normal opening hours, visitors can book tickets for a four-course medieval banquet, held nightly at 5:30pm and 8:30pm", "pages": "192", "coordinates": [52.70049210333436, -8.811569585365229], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Bunratty%20Castle.jpg?width=600"}, {"id": 78, "name": "Durty Nelly's", "county": "Clare", "categories": ["Bar", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "Set in the shadow of Bunratty Castle, Durty Nelly's is a hit with locals and tourists alike. The warren of rooms, inglenook fire-places and histroical portraits lend it a 17th-century atmosphere", "pages": "193", "coordinates": [52.696490909574614, -8.811307063947202], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Durty%20Nelly's%20-%20panoramio.jpg?width=600"}, {"id": 79, "name": "Rock of Cashel", "county": "Tiperrary", "categories": ["Landmark", "Church"], "ben": false, "cass": true, "person": "cass", "description": "This rocky stronghold, which rises dramatically out of Tipperary plain, was a symbol of royal and priestly power for more than a millenium. Today it remains one of Ireland's most spectacular historic sites, with a striking meld of architecture from various periods. In 1101, the Kings of Munster handed the castle over to the Church", "pages": "194", "coordinates": [52.52018725333608, -7.88952952213778], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Rock%20of%20Cashel%2C%20Tipperary.jpg?width=600"}, {"id": 80, "name": "The Mullaghmore Loop Walk", "county": "Clare", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "Offers a captivating trek through limestone pavement and remote upland areas", "pages": "196", "coordinates": [52.99643802607131, -9.028649876374939], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The%20Burren%20National%20Park%20Mullaghmore.JPG?width=600"}, {"id": 81, "name": "Kilkee Beach", "county": "Clare", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "Magnificent horseshoe-shaped beach and pollock holes (natural pools) have not lost their glorious appeal", "pages": "196", "coordinates": [52.68087381642643, -9.64719899827273], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/A%20rough%20day%20at%20Kilkee%20Beach%20-%20geograph.org.uk%20-%206427882.jpg?width=600"}, {"id": 82, "name": "Doolin", "county": "Clare", "categories": ["Location", "Islands"], "ben": false, "cass": true, "person": "cass", "description": "This vibrant former fishing village, nestled on a plateau near the Cliffs of Moher, regains its relaxed charm during the offsesason when the crowds have gone. Ferries to the famous Aran Islands depart regularly from Doolin Pier, along with tours that take visitors beneath the stunning Cliffs of Moher", "pages": "197", "coordinates": [53.015961234584196, -9.377085497757943], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/DoolinIreland.jpg?width=600"}, {"id": 83, "name": "Ennis", "county": "Clare", "categories": ["Location", "Shop", "Bar", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "Clare's county town, on the banks of the River Fergus, is a charming place with winding lanes that recall its medieval beginnings. The town is also renowned for its painted shopfronts and folk music festivals. It abounds in \"singing\" pubs and traditional music shops", "pages": "197", "coordinates": [52.846705114760795, -8.987435171618918], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Ennis.JPG?width=600"}, {"id": 84, "name": "Craggaunowen", "county": "Clare", "categories": ["Castle"], "ben": true, "cass": false, "person": "ben", "description": "Designed to bring Bronze Age and Celtic culture to life, is a shining example of a recreated prehistoric site", "pages": "198", "coordinates": [52.811404591897535, -8.795137342486884], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Craggaunowen%202004.jpg?width=600"}, {"id": 85, "name": "A Fairy Trail at Lough Gur", "county": "Limerick", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "Lough Gur is supposedly home to Fer Fi, King of the Fairies. His throne sits beside the site's heritage centre, and a trail made of 110 stone steps will lead children to a fairy village (and stunning lough views)", "pages": "200", "coordinates": [52.33038283127884, -8.974707724181462], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Lough%20gur.jpg?width=600"}, {"id": 86, "name": "Limerick Milk Market", "county": "Limerick", "categories": ["Food Market"], "ben": false, "cass": true, "person": "cass", "description": "Every weekend since the mid-19th century, the Limerick Milk Market has offered the finest local produce from The Golden Vale", "pages": "201", "coordinates": [52.66377560422158, -8.621258139330655], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/The%20Milk%20Market%2C%20Limerick%20-%20street%20scene.jpg?width=600"}, {"id": 87, "name": "Adare", "county": "Limerick", "categories": ["Location"], "ben": true, "cass": false, "person": "ben", "description": "Adare is billed as Ireland's prettiest village. The village is a picture of neat stonework and thatched roofs punctuated by pretty ruins, all in a woodland setting", "pages": "202", "coordinates": [52.56353390757478, -8.79243099378867], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/%22Ein%20malerisches%20Dorf%20im%20County%20Limerick%22.%2001.jpg?width=600"}, {"id": 88, "name": "Cahir", "county": "Tipperary", "categories": ["Location", "Bar", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "A busy market town. The pub-lined Castle Street is the most appealing area, which leads to the Suir River", "pages": "204", "coordinates": [52.37507884269275, -7.924302896369937], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Cahir%20Castle%2C%20Tipperary.JPG?width=600"}, {"id": 89, "name": "Hickey's Bakery and Cafe", "county": "Tipperary", "categories": ["Restaurant"], "ben": false, "cass": true, "person": "cass", "description": "A local institution, Hickey's has been baking bread and cakes for over four generations. Centrally located, it's the perfect place to stop for lunch", "pages": "204", "coordinates": [52.35246392972938, -7.705323566327829], "image": "https://ie.publocation.com/sites/ie.publocation.com/files/styles/large/public/pub-images/hickeys-bakery-14245.jpg?itok=wP1tYQ_B\u0026slideshow=true\u0026slideshowAuto=false\u0026slideshowSpeed=4000\u0026speed=350\u0026transition=elastic"}, {"id": 90, "name": "Clonmel", "county": "Tipperary", "categories": ["Location", "Shop", "Bar", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "Tipperary's main town bustling with quirky architecture and lively nightlife. Nearby is O'Connell Street, Clonmel's main shopping street, which is straddled by the West Gate, bult in 1831", "pages": "204", "coordinates": [52.362736096240184, -7.70134803834105], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Clonmel%20-%20The%20Main%20Guard%20-%20geograph.org.uk%20-%206008156.jpg?width=600"}, {"id": 91, "name": "Eyre Square", "county": "Galway", "categories": ["Location", "Shop"], "ben": true, "cass": false, "person": "ben", "description": "Encloses a pleasant plaza and park lined with imposing 19th-century buildings. Eyre Square Centre is a modern shopping mall built to incorporate sections of the historic city walls", "pages": "210", "coordinates": [53.27448051686355, -9.048637516027938], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/An%20Fhaiche%20Mh%C3%B3r%2C%20Gaillimh%20-%20Eyre%20Square%2C%20Galway.jpg?width=600"}, {"id": 92, "name": "The Dough Bros", "county": "Galway", "categories": ["Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "First opened as a food truck, this hip pizzeria spot has been lauded as one of the best in the world. Try \"The Stinger\", wtih chorizo and hot honey", "pages": "210", "coordinates": [53.27286269037356, -9.051277904391728], "image": "https://s.inyourpocket.com/gallery/271569.jpg"}, {"id": 93, "name": "The Claddagh", "county": "Galway", "categories": ["Location"], "ben": false, "cass": true, "person": "cass", "description": "A fiercely independent fishing community dating from the 5th century and governed by their own \"king\". The enduring symbols of this Irish-speaking community  are Claddagh rings, betrothal rings traditionally handed down from mother to daughter", "pages": "211", "coordinates": [53.27274093031139, -9.052349490804781], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Galway%20Claddagh.jpg?width=600"}, {"id": 94, "name": "Aran Islands/Craggy Cliffs of Irishmore", "county": "Galway", "categories": ["Nature", "Islands"], "ben": true, "cass": true, "person": "both", "description": "Famed for their bleak beauty and woolly jumpers, the Aran Islands are a cluster of three islands located at the mouth of Galway Bay. They are composed of the same limestone that forms the Burren in Co Clare, and their tiny population largely speaks Irish", "pages": "212", "coordinates": [53.1109268061197, -9.683490185979595], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Inishmore%20cliffs%20at%20Dun%20Aengus.jpg?width=600"}, {"id": 95, "name": "Achill Island/Atlantic Coast Drive", "county": "Mayo", "categories": ["Nature", "Islands"], "ben": true, "cass": false, "person": "ben", "description": "Ireland's largest island, an irregular chunk of mountainous land about 14 miles long and 12 miles wide. The best introduction is the Atlantic Coast Drive, a circular, sign-posted route from Achill Sound", "pages": "214", "coordinates": [53.962400707293206, -10.016987915733381], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Achill%20Island.jpg?width=600"}, {"id": 96, "name": "South Mall/Bridge Street in Westport", "county": "Mayo", "categories": ["Location", "Shop"], "ben": false, "cass": true, "person": "cass", "description": "A neat town that originally traded in yarn, cloth, beer and slate. Beyond the South Mall is shop-lined bridge street", "pages": "214", "coordinates": [53.800543660615965, -9.521096802666227], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Westport%20Mayo%20Bridge%20Street%202007%2008%2012.jpg?width=600"}, {"id": 97, "name": "Foxford Woollen Mills", "county": "Mayo", "categories": ["Location", "Activity", "Shop"], "ben": false, "cass": true, "person": "cass", "description": "This tranquill market town is mostly known for the Foxford Woollen Mills, founded in 1892 by an Irish nun, Mother Arsenius. The thriving mill now supplies top fashion houses. A guided your traces the mill's history and visitors can see craftspeople at work", "pages": "215", "coordinates": [53.98237637960126, -9.11276076810216], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Foxford%20Woollen%20Mill%20Visitor%20Centre%20-%20geograph.org.uk%20-%20486792.jpg?width=600"}, {"id": 98, "name": "Knock", "county": "Mayo", "categories": ["Landmark"], "ben": true, "cass": false, "person": "ben", "description": "Landmark, Church", "pages": "215", "coordinates": [53.79044308777966, -8.91979233438377], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Knock%20Shrine.jpg?width=600"}, {"id": 99, "name": "Croagh Patrick", "county": "Mayo", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "Ireland's holy mountain, named after the nationa saint, is one of Mayo's best known landmarks. In 441 CE, St Patrick is said to have spent 40 days on the mountain fasting and praying for the Irish", "pages": "215", "coordinates": [53.76053920946017, -9.656500950771829], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Croagh%20Patrick.jpg?width=600"}, {"id": 100, "name": "Clare Island", "county": "Mayo", "categories": ["Nature", "Islands"], "ben": true, "cass": false, "person": "ben", "description": "Clare Island is dominated by two hills, and a square 15th-century castle commands the headland and the harbour", "pages": "216", "coordinates": [53.80727256906964, -9.989122680406744], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Clare%20Island.jpg?width=600"}, {"id": 101, "name": "Clifden", "county": "Galway", "categories": ["Location", "Shop", "Church", "Bar", "Drink"], "ben": true, "cass": true, "person": "both", "description": "Framed by the grandeur of the Twelve Bens mountain range and with a striking skyline dominated by two church spires, this early 19th-century market town passes for the capital of the Connemara region and is a good base for exploring. Today craft shops have taken over much of the town. In the centre is the square, a place for lively pubs where traditional music is common", "pages": "216", "coordinates": [53.48907676218076, -10.019940509199511], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/ClifdenOverview.JPG?width=600"}, {"id": 102, "name": "Inishbofin", "county": "Galway", "categories": ["Nature", "Church", "Islands"], "ben": false, "cass": true, "person": "cass", "description": "This mysterious island - whose name means \"island of the white cow\" - was chosen for its remoteness by the exiled 7th-century St Colman, English Abbot of Lindisfarne. On the site of his original monastery is a late medieval church, graveyard and holy well. In 1653, it was captured by Cromwellian forces and used as a prison for Catholic priests", "pages": "217", "coordinates": [53.614095410948536, -10.208385818668994], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Inishbofin.jpg?width=600"}, {"id": 103, "name": "Sunset Kayaking at Mannin Bay", "county": "Galway", "categories": ["Activity", "Nature"], "ben": false, "cass": true, "person": "cass", "description": "The calm, blue waters of Mannin Bay are the perfect spot for a kayaking trip. The sunset tour is even more magical", "pages": "218", "coordinates": [53.44246897910681, -10.060189221351775], "image": "https://cdn.getyourguide.com/img/tour/63f8b6102c30e.jpeg/146.jpg"}, {"id": 104, "name": "Pony Trekking at Lough Corrib", "county": "Galway", "categories": ["Location", "Activity", "Shop", "Animals", "Islands"], "ben": false, "cass": true, "person": "cass", "description": "An angler's paradise that offers the chance to fish for brown trout, salmon, pike, perch and eels. The lake is tranquil, dotted with uninhabited islands and framed by meadows, reedbeds and wooded shores. The village has craft shops and thatched cottages and is also popular for golf, angling, hiking and pony trekking", "pages": "218", "coordinates": [53.42913526354101, -9.316586889143275], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Lough%20Corrib%20%2C%20Clonbur%20.%20Co.%20Galway.JPG?width=600"}, {"id": 105, "name": "Kylemore Abbey", "county": "Galway", "categories": ["Castle"], "ben": false, "cass": true, "person": "cass", "description": "Sheltered by the slopes of the Twelve Bens mountain range, this lakeside castle is a romantic Gothic Revival fantasy", "pages": "218", "coordinates": [53.561776249141786, -9.888913348559228], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Kylemore%20Abbey.jpg?width=600"}, {"id": 106, "name": "Connemara National Park", "county": "Galway", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "A combination of bogland, lakes and mountains makes up this National Park, established in 1980. Within its more than 8 sq miles are four of the Twelve Bens, including Benbaun, the highest mountain in the range, and the peak of Diamond Hill. Visitors come for the spectacular landscape and the famous Connemara ponies", "pages": "219", "coordinates": [53.541837575142644, -9.878157904447072], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Connemara%20National%20Park%2001.jpg?width=600"}, {"id": 107, "name": "Ashford Castle at Lough Corrib", "county": "Galway", "categories": ["Castle", "Stay"], "ben": true, "cass": false, "person": "ben", "description": "Located in the shores of Lough Corrib, this Gothic Revival castle contains 83 luxurious rooms and a world-class spa. It is one of Ireland's best hotels", "pages": "219", "coordinates": [53.534695396984795, -9.28401822394264], "image": "https://blogs-images.forbes.com/johnoseid/files/2018/01/ASH_Exterior-1200x800.jpg"}, {"id": 108, "name": "Strokestown Park", "county": "Roscommon", "categories": ["Museum", "Activity"], "ben": true, "cass": false, "person": "ben", "description": "This Palladian mansion was built in the 1730s for Thomas Mahon. On site is the renovated National Famine Museum, which tells the story of the aristocratic landlords of Strokestown as well as their tenants. Through interactive displays and immersive experiences, you'll learn about the realities of the 1840s Famine", "pages": "222", "coordinates": [53.77655639389428, -8.097060354621421], "image": "https://www.brendanvacations.com/media/51knbvdd/large-co-roscommon-strokestown-park.jpg"}, {"id": 109, "name": "Boyle", "county": "Roscommon", "categories": ["Location", "Church", "Islands"], "ben": false, "cass": true, "person": "cass", "description": "County Roscommon's most charming town, is blessed with fine Georgian and medieval architecture. Boyle Abbey is a well-preserved Cistercian monastery founded in 1611 as a sister house to Mellifont in County Louth. A short drive from Boyle is an island-studded lake surrounded by woodland - a glorious setting for the Lough Key Forest Park. The 790-acre park formed part of the Rockingham estate until 1957, when Rockingham house burned down", "pages": "223", "coordinates": [53.973173829447674, -8.302208564929492], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Marketplace%2C%20Boyle%20-%20geograph.org.uk%20-%201635475.jpg?width=600"}, {"id": 110, "name": "Clonalis House", "county": "Roscommon", "categories": ["Stay", "Books"], "ben": true, "cass": false, "person": "ben", "description": "Live like the High Kings of Ireland for a night at this historic house, overlooking stunning parkland. The period rooms are lavishly decorated, particularly the book-lined library", "pages": "223", "coordinates": [53.78047572496816, -8.514775714148628], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Castlerea%20-%20Clonalis%20House%20-%2020190823040902.jpg?width=600"}, {"id": 111, "name": "Slieve League", "county": "Donegal", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "One of Ireland's best-kept secrets, this craggy coastline is a sight to rival the Cliffs of Moher. Soaring nearly three times their height, and without Moher's crowds or admission charge, the sea cliffs of Slieve League are a key attraction along the Wild Atlantic Way. At sunset the rock is streaked with changing shades of red, amber and ochre. In summertime, the Slieve League Cultural Centre offers lessons in traditional Irish music", "pages": "228", "coordinates": [54.62746106193285, -8.68314568441204], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Slieve%20League%20Cliffs.jpg?width=600"}, {"id": 112, "name": "Sliabh Liag Boat Trips", "county": "Donegal", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "During the summer months, those hoping for spectacular views without the strenuous climb can see them from below, on a sightseeing cruise with Sliabh Liag Boat Trips", "pages": "228", "coordinates": [54.634219158842015, -8.646828815960541], "image": "https://assets-eu-01.kc-usercontent.com/aa24ba70-9a12-01ae-259b-7ef588a0b2ef/b4a20d8a-8f5f-432f-87ec-f31b5d8c3808/boat-at-sliabh-liag-co-donegal.jpg"}, {"id": 113, "name": "Bunglass Point", "county": "Donegal", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "From Teelin, hiking veterans can follow the challenging, meandering Pilgrim's Path up the cliffs; alternatively, it's a 10-minute drive to Bunglass Point, where the best views can be found", "pages": "229", "coordinates": [54.627488810872215, -8.68379272388823], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Giant's%20Table%20and%20Chair%2C%20Bunglass%20-%20geograph.org.uk%20-%2011364.jpg?width=600"}, {"id": 114, "name": "Bloody Foreland", "county": "Donegal", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "Bloody Foreland, which gets its name from the rubescent glow of the rocks at sunset, has magnificent scenery", "pages": "230", "coordinates": [55.1577361047228, -8.279708234816994], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Bloody%20foreland.jpg?width=600"}, {"id": 115, "name": "Glenveagh National Park", "county": "Donegal", "categories": ["Nature"], "ben": false, "cass": true, "person": "cass", "description": "Covering nearly 40,000 acres, this takes in the beautiful valley occupied by Lough Veagh, and Poisoned Glen, a marshy valley enclosed by dramatic cliffs. The park also protects the largest herd of red deer in the country", "pages": "230", "coordinates": [55.057679847293656, -7.938566666520205], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Glenveagh%20National%20Park%20Gleanveagh%20Castle.jpg?width=600"}, {"id": 116, "name": "Horn Head", "county": "Donegal", "categories": ["Nature", "Animals"], "ben": false, "cass": true, "person": "cass", "description": "Carpeted in heather and rich in birdlife, this is the most scenic of the northern Donegal headlands, with lovely views of the sea and mountains. The town is perfect for outdoor activities such as surfing, hill walking, rock climbing and horse-riding. Dunfanaghy's local beach, Killlahoey Strand, offers swimming and is often deserted", "pages": "231", "coordinates": [55.22485957876592, -7.980205210471063], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Horn%20Head.jpg?width=600"}, {"id": 117, "name": "Doagh Famine Village", "county": "Donegal", "categories": ["Activity"], "ben": true, "cass": false, "person": "ben", "description": "Tells the story of an Irish family from the Great Famine to the present day. Animated guides bring the past to life", "pages": "232", "coordinates": [55.309013499488486, -7.334653885745078], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Doagh%20Famine%20Village%20-%20geograph.org.uk%20-%2051690.jpg?width=600"}, {"id": 118, "name": "The Rosses", "county": "Donegal", "categories": ["Nature", "Beach"], "ben": true, "cass": false, "person": "ben", "description": "A rocky headland dotted with more than 100 lakes, the Rosses is one of the most picturesque and unspoiled corners of Donegal. There is a glorious sheltered beach 5 miles west of Dungloe at Maghery Bay, from where you can also walk to nearby Crohy Head, an area known for its caves, arches and unusual cliff formations", "pages": "232", "coordinates": [54.92544184164986, -8.453728366243594], "image": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDqBuDKG2WW6KvzRxYbpunxeeJG0jWYnhPSoswhG-pWHGc8IsxZelTxduc\u0026s=10"}, {"id": 119, "name": "Letterkenny", "county": "Donegal", "categories": ["Location"], "ben": false, "cass": true, "person": "cass", "description": "Donegal's largest town and the region's leading business centre. The likeable town makes a good base from which to explore the northern coast of Donegal", "pages": "233", "coordinates": [54.95364517603111, -7.726752206890276], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Buildings%20and%20Cathedral%20spire%2C%20seen%20from%20Convent%20Road%2C%20Letterkenny%20-%20geograph.org.uk%20-%205859274.jpg?width=600"}, {"id": 120, "name": "Ardara", "county": "Donegal", "categories": ["Location", "Shop", "Bar", "Drink"], "ben": true, "cass": true, "person": "both", "description": "The weaving capital of Donegal, is lined with shops selling locally made tweeds and hand-knitted sweaters; some larger stores put on displays of hand-loom weaving. Ardara is worth a stop for its pubs, much loved for their fiddle sessions", "pages": "234", "coordinates": [54.76655041989772, -8.407998971712], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Ardara%20-%20Main%20Street%20(N56)%20West%20of%20Town%20Centre%20-%20geograph.org.uk%20-%203740332.jpg?width=600"}, {"id": 121, "name": "Glencolmcille/Folk Village Museum", "county": "Donegal", "categories": ["Museum"], "ben": true, "cass": false, "person": "ben", "description": "A quiet, grassy, valley scattered with brightly coloured cottages, feels very much like a backwater, in spite of the sizeable number of visitors who come here. The main attraction is the Folk Village Museum, a cluster of replica cottages perched on the hillside, which depicts rural Donegal lifestyles through the ages", "pages": "234", "coordinates": [54.707467228348044, -8.739848856429559], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Glencolmcille%20Folk%20Village.jpg?width=600"}, {"id": 122, "name": "Beaches in Donegal", "county": "Donegal", "categories": ["Nature", "Beach"], "ben": true, "cass": false, "person": "ben", "description": "Five Fingers Strand - Ideal for seekers of solitude, this beach is named after the five sea stacks that rise from the water to the north. Murder Hole Beach - The patch-work of dunes, cliffs and caves makes this beach a hidden gem well worth visiting. Ballymastocker Bay - This bay, often considered one of the most beautiful in the country, offers glorious golden sands. Tullan Strand - A renowned surfer's paradise, this beach is set before a sublime mountainous backdrop", "pages": "235", "coordinates": [55.319715461586455, -7.336783798392386], "image": "https://assets-eu-01.kc-usercontent.com/aa24ba70-9a12-01ae-259b-7ef588a0b2ef/536f693b-c415-4125-8930-b8fdb0332b68/kinnagoe-bay-co-donegal.jpg?w=876\u0026h=492\u0026fm=jpg\u0026q=66\u0026fit=crop"}, {"id": 123, "name": "Newgrage and the Boyne Valley", "county": "Meath", "categories": ["Landmark", "Nature"], "ben": true, "cass": true, "person": "both", "description": "Built in around 3200 BCE - predating the pyramids by more than 600 years - the grave was left untouched by all invaders until it was rediscovered in 1699. When the site was excavated in the 1960s, archaeologists discovered that on and around the winter solstice, rays of sun enter the tomb and light up the burial chamber - making it the world's oldest solar observatory", "pages": "248", "coordinates": [53.69485162518534, -6.474837242989], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Newgrange%2C%20Meath.jpg?width=600"}, {"id": 124, "name": "Listoke Distillery and Gin School", "county": "Louth", "categories": ["Activity", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "Ireland's first gin school is located at the heart of the Boyne Valley. Visitors are greeted with a Listoke 1777 G\u0026T before a tour of the distillery. After a lesson in the brand's history and a quick introduction to botanicals, they can then begin to design their own 700ml bottle of gin", "pages": "250", "coordinates": [53.79263208635003, -6.4217445763653895], "image": "https://assets-eu-01.kc-usercontent.com/aa24ba70-9a12-01ae-259b-7ef588a0b2ef/7881f62a-1617-4ea4-b70c-4ff8b7f9f257/interior-of-the-gin-school-at-listoke-distillery.jpg"}, {"id": 125, "name": "Knowth", "county": "Meath", "categories": ["Landmark"], "ben": false, "cass": true, "person": "cass", "description": "The two sister graves included in the UNESCO World Heritage Site are called Knowth and Dowth. Knowth contains the greatest concentration of megalithic art in Europe. Take a walk around the perimeter of the mound and you will be able to see the engravings on the kerbstones, with Celtic swirls, spirals and curves carved into the rock", "pages": "250", "coordinates": [53.70165365573088, -6.491620890341841], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/177%20Knowth%2C%20Coutny%20Meath.jpg?width=600"}, {"id": 126, "name": "Free Heritage Walking Tour of Monaghan", "county": "Monaghan", "categories": ["Activity"], "ben": false, "cass": true, "person": "cass", "description": "A free heritage walking tour of Monaghan takes place every Saturday morning at 11am from April to October, leaving from the Diamond. Focusing on historic sights, the tour is peppered with anecdotes", "pages": "252", "coordinates": [54.248968004325555, -6.96533206147782], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/A%20busy%20street%2C%20Monaghan%20-%20geograph.org.uk%20-%203934488.jpg?width=600"}, {"id": 127, "name": "Drumlane", "county": "Cavan", "categories": ["Landmark", "Church"], "ben": true, "cass": false, "person": "ben", "description": "Standing alone by the River Erne, Drumlane's medieval church and round tower merit a visit for their delightful setting as much as for the ruins themselves", "pages": "252", "coordinates": [54.07554669995112, -7.01412301139351], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Drumlane%20Church%20and%20Round%20Tower.JPG?width=600"}, {"id": 128, "name": "Ardagh", "county": "Longford", "categories": ["Location"], "ben": false, "cass": true, "person": "cass", "description": "Ardagh is one of the prettiest villages in Longford, with charming stone cottages around a green", "pages": "252", "coordinates": [53.667632104603754, -7.691772604299821], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Ardagh%20-%20Ardagh%20Heritage%20Village-Workers%20House%201%20-%2020170930220938.jpg?width=600"}, {"id": 129, "name": "MacNean House \u0026 Restaurant", "county": "Cavan", "categories": ["Restaurant"], "ben": true, "cass": false, "person": "ben", "description": "Weekends are booked out months in advance at this culinary gem, which has an inventive tasting menu. The head chef, Neven Maguire, also runs a cookery school here", "pages": "253", "coordinates": [54.291425013204204, -7.875637268086864], "image": "https://imengine.public.prod.sbp.infomaker.io/?crop_h=0.99999\u0026crop_w=0.99999\u0026function=cropresize\u0026height=675\u0026q=75\u0026source=false\u0026type=preview\u0026uuid=6913002d-2bec-5cfe-9ee8-e87052154692\u0026width=1200\u0026x=0\u0026y=0"}, {"id": 130, "name": "Hill of Tara", "county": "Meath", "categories": ["Landmark", "Nature"], "ben": true, "cass": false, "person": "ben", "description": "A site of mythical importance, Tara has more than 30 visible monuments. The spread of Christianity, which eroded the importance of Tara, is marked by a statue of St Patrick", "pages": "256", "coordinates": [53.58300598802282, -6.602423011785018], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Hill%20of%20Tara%20aerial%20view.jpg?width=600"}, {"id": 131, "name": "Slane Castle", "county": "Meath", "categories": ["Castle"], "ben": false, "cass": true, "person": "cass", "description": "The sloping grounds at Slane Castle form a natural amphitheatre, meaning that it is often used as a unique concert venue. Acts who have previously performed here include Queen, David Bowie, and U2", "pages": "256", "coordinates": [53.70979917748323, -6.560563237424914], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Slane%20Castle.jpg?width=600"}, {"id": 132, "name": "Belvedere House", "county": "Westmeath", "categories": ["Landmark"], "ben": false, "cass": true, "person": "cass", "description": "Just off the Kilbeggan road from Mullingar stands Belvedere House, a romantic Palladian villa overlooking Lough Ennel. The house, built in 1740 by Richard Castle, is decorated with Rococo plasterwork and set in beautiful grounds", "pages": "257", "coordinates": [53.47752982689603, -7.368161385327221], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Belvedere%20House.jpg?width=600"}, {"id": 133, "name": "Kilbeggan/Distillery Experience", "county": "Westmeath", "categories": ["Activity", "Drink"], "ben": true, "cass": true, "person": "both", "description": "Situated between Mullingar and Tullamore, this pleasant village has a small harbour on the Grand Canal. However, the main point of interest is Kilbeggan Distillery Experience. Founded in 1757, it claims to be the oldest licensed pot distillery in the world to be still producing whiskey", "pages": "258", "coordinates": [53.36899092845059, -7.500113354641612], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Kilbeggan%20-%20Locke's%20Distilerie.jpg?width=600"}, {"id": 134, "name": "Sean's Bar", "county": "Westmeath", "categories": ["Bar", "Drink"], "ben": true, "cass": true, "person": "both", "description": "Offering local hospitality for over a milennium, Sean's Bar is not only the oldest bar in Ireland but also one of the oldest in Europe", "pages": "258", "coordinates": [53.42277175321756, -7.941727729511605], "image": "https://loveincorporated.blob.core.windows.net/contentimages/largesize/e38aaa0a-0e81-40a8-a935-6d8558b311e5-seans-bar-ireland.jpg"}, {"id": 135, "name": "Tullamore D.E.W. Visitor Centre", "county": "Offaly", "categories": ["Activity", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "The charming town of Tullamore and its most famous export, Tullamore Dew Whiskey, are intrinsically linked. The tour begins with an Irish coffee, and includes three tastins of Tullamore Dew, all of which are available in the shop. You can also create your own blend of whiskey to bottle and take away, for an additional fe", "pages": "258", "coordinates": [53.252837274797244, -7.499945643010954], "image": "https://cdn.sanity.io/images/b421oua2/production/c8a2d258af7b5c10f5963384a956e8d6f15926bd-1376x768.png?fm=webp\u0026q=85"}, {"id": 136, "name": "St Anne's Cathedral", "county": "Belfast", "categories": ["Landmark", "Church"], "ben": true, "cass": false, "person": "ben", "description": "Consecrated in 1904, this Anglican cathedral took over 100 years to be completed. The impressive interior includes elaborate mosaics - the one covering the baptistry ceiling contains over 150,000 pieces", "pages": "270", "coordinates": [54.603012036797914, -5.927812069925795], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/St%20Anne's%20Cathedral%2C%20Belfast.jpg?width=600"}, {"id": 137, "name": "Crown Liquor Saloon", "county": "Belfast", "categories": ["Bar", "Drink"], "ben": true, "cass": true, "person": "both", "description": "Even teetotallers should make a detour to this 1880s drinking palace. The Crown is Belfast's most famous pub; today it is a grade A building and treasured landmark. The lovingly restored interior features stained glass, mosaics and cozy wooden snugs - the perfect place for a pint of the black stuff and some Strangford Lough mussels", "pages": "271", "coordinates": [54.59481987311107, -5.933374312253531], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Crown%20Liquor%20Saloon.jpg?width=600"}, {"id": 138, "name": "Botanic Gardens", "county": "Belfast", "categories": ["Nature"], "ben": true, "cass": false, "person": "ben", "description": "Backing on to the university, these gardens provide a refuge from the bustle of campus. The 1839 Palm House is a superb example of curvilinear glass and cast-iron work", "pages": "272", "coordinates": [54.58250843801267, -5.9318306717812455], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Autumn%2C%20Botanic%20Gardens%2C%20Belfast%20(1)%20-%20geograph.org.uk%20-%202103590.jpg?width=600"}, {"id": 139, "name": "Ulster Museum", "county": "Belfast", "categories": ["Museum"], "ben": false, "cass": true, "person": "cass", "description": "Founded in 1929 as the Belfast Municipal Museum and Art Gallery, this excellent museum houses rich collections of art, local history, natural sciences and archaeology. The 20 foot long Edmontosaurus dinosaur skeleton, the Egyptian mummy, Takabuti, and the stunning coiled Corrard torc are three of the most popular exhibits", "pages": "272", "coordinates": [54.58255334406462, -5.934764002472258], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Atrium%2C%20Ulster%20Museum%20-%20geograph.org.uk%20-%207826941.jpg?width=600"}, {"id": 140, "name": "Cave Hill", "county": "Belfast", "categories": ["Nature", "Landmark"], "ben": true, "cass": true, "person": "both", "description": "One of the city's most visible landmarks, the whole of Belfast can be viewed from Cave Hill's 1,207 ft high summit. The hill's craggy profile is said to have inspred the giant in Gulliver's Travels, and it was next to MacArt's Fort", "pages": "273", "coordinates": [54.649881635649066, -5.94975369083239], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Cave%20Hill%2C%20Belfast.jpg?width=600"}, {"id": 141, "name": "Titanic House", "county": "Belfast", "categories": ["Landmark"], "ben": true, "cass": false, "person": "ben", "description": "Just a short walk from Belfast city centre, the Titanic Quarter is one of the largest waterfront regeneration projects in Europe.A six-storey aluminum-clad building in the shape of a ship's prow, the Titanic Belfast is an impressive sight", "pages": "274", "coordinates": [54.60818628750114, -5.909392945633985], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Titanic%20Belfast.jpg?width=600"}, {"id": 142, "name": "Bullitt Hotel", "cou
