nty": "Belfast", "categories": ["Stay"], "ben": false, "cass": true, "person": "cass", "description": "This central hotel offers \"no frills\" comfort - including a rooftop bar", "pages": "275", "coordinates": [54.59973418351633, -5.924438931307514], "image": "https://www.marazzigroup.com/app/uploads/2023/10/import-blog_hotel-bullitt-il-fascino-dello-stile-industriale-un-boutique-hotel-nel-cuore-di-belfast-1.jpg"}, {"id": 143, "name": "Giant's Causeway", "county": "Antrim", "categories": ["Nature", "Landmark"], "ben": true, "cass": true, "person": "both", "description": "Northern Ireland's north coast is home to some unique and unmissable landmarks, the most remarkable of which is the Giant's Causeway. The sheer strangeness of this place and the bizarre regularity of its basalt columns have made the Giant's Causeway the subject of numerous legends. Millions of years of geological activity can be seen in the eroded cliffs flanking the Causeway, including a band of reddish rock that is the inter-basaltic layer, formed during a long period of temperate climate conditions", "pages": "276", "coordinates": [55.239537884849575, -6.50800946640236], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Giant's%20Causeway.jpg?width=600"}, {"id": 144, "name": "Carrick-a-Rede Rope Bridge", "county": "Antrim", "categories": ["Activity", "Islands"], "ben": true, "cass": false, "person": "ben", "description": "First erected by salmon fishers in 1755, the Rope Bridge hangs 100ft above the Atlantic Ocean and wobbles and twists as soon as you stand on it. Made of planks strung between wires, it provides access to tiny Carrick-a-Rede island across the 65ft chasm. There are strong handrails and safety nets, but it's definitely not for those with vertigo", "pages": "279", "coordinates": [55.23981215787451, -6.34880945892773], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Carrick-a-Rede%20Rope%20Bridge%20and%20cliffs.jpg?width=600"}, {"id": 145, "name": "The Dark Hedges", "county": "Antrim", "categories": ["Landmark", "Nature"], "ben": true, "cass": false, "person": "ben", "description": "This extraordinary tree-lined avenue is also worth visiting on your way to or from the north coast. One of Northern Ireland's most-photographed natural phenomena, the spectacular stretch has also appeared as the King's Road on Game of Thrones", "pages": "279", "coordinates": [55.13480326904947, -6.3802641024445625], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Dark%20Hedges%20near%20Armoy%2C%20Co%20Antrim.jpg?width=600"}, {"id": 146, "name": "Ramore Restaurants", "county": "Antrim", "categories": ["Restaurant", "Drink"], "ben": false, "cass": true, "person": "cass", "description": "Six family-owned restaurants right on Portrush's seafront. Arrive early to have a drink at the Gin Bar", "pages": "279", "coordinates": [55.20818014089824, -6.657660000586377], "image": "https://eu-assets.simpleview-europe.com/causewaycoast/imageresizer/?action=ProductDetailImage\u0026image=%2Fdmsimgs%2FF0BBE1F54EA3A19632603884D095B5BD9AC2951C.jpg"}, {"id": 147, "name": "Walled City Brewery", "county": "Derry", "categories": ["Bar", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "This brewery offers great gastropub fare, including hearty burgers and roasts", "pages": "283", "coordinates": [54.99803535863818, -7.309629240846493], "image": "https://static.wixstatic.com/media/774b80_98e3948c86204d13bed858f9ec137cd7~mv2.jpg/v1/fill/w_862%2Ch_645%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_auto/774b80_98e3948c86204d13bed858f9ec137cd7~mv2.jpg"}, {"id": 148, "name": "Portstewart/Gobbins Cliff Path", "county": "Derry", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "Just west of town, and accessible by road or by a cliffside walk, stretches Portstewart Strand, a long, sandy beach protected by the National Trust. The adventurous 2 mile Gobbins Cliff Path features a steel frame, a true masterpiece of Edwardian engineering", "pages": "284", "coordinates": [54.78110059617915, -5.706859028098936], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Bridge%20and%20cliff%20at%20The%20Gobbins.JPG?width=600"}, {"id": 149, "name": "Old Bushmills Distillery", "county": "Antrim", "categories": ["Activity", "Drink"], "ben": true, "cass": false, "person": "ben", "description": "The old Bushmills plant prides itself on being the world's oldest distillery. Its Grant to Distil dates form 1608, but the spirit was probably made here at least 200 years before that. Tours of the distillery end with a whiskey sampling in the 1608 Bar", "pages": "285", "coordinates": [55.2029883011206, -6.516507881389367], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Old%20Bushmills%20Distillery.jpg?width=600"}, {"id": 150, "name": "Glenariff Forest Park", "county": "Antrim", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "The main scenic path runs through thick woodland and wildflower meadows and round the sheer sides of a gorge, past three waterfalls", "pages": "286", "coordinates": [55.015596989865486, -6.106583969905144], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Glenariff%20Waterfall.jpg?width=600"}, {"id": 151, "name": "OM Dark Sky Park and Observatory", "county": "Tyrone", "categories": ["Activity", "Nature"], "ben": true, "cass": true, "person": "both", "description": "Opened in 2020 and is one of 78 places in the world with official International Dark Sky accreditation. With minimal light pollution and a rural location deep in the Sperrin Mountains, this is prime stargazing territory, and in early autumn and spring, you may even see the Aurora Borealis", "pages": "288", "coordinates": [54.71905913470596, -6.9160879834111135], "image": "https://media.cntraveller.com/photos/65d4711dc77f9c25f7655b70/master/w_1600%2Cc_limit/OM%2520Dark%2520Sky%2520Park%2520%26%2520Observatory-feb24-r-global.jpeg"}, {"id": 152, "name": "Belleek Pottery", "county": "Fermanagh", "categories": ["Activity", "Museum"], "ben": true, "cass": false, "person": "ben", "description": "The border village of Belleek would attract few visitors other than anglers were it not for the world-famous Belleek Pottery, founded in 1857. Guided tours take in the stages of production, inlcuding moulding and casting, while there are numerous elaborate showpieces on display in the small museum", "pages": "289", "coordinates": [54.479334374293586, -8.09257361225936], "image": "https://www.worldatlas.com/r/w768/upload/2e/78/21/shutterstock-2185456387-s3cdn.jpg"}, {"id": 153, "name": "Mounre Mountains", "county": "Down", "categories": ["Nature"], "ben": true, "cass": true, "person": "both", "description": "These mountains occupy just a small corner of County Down, with no more than a dozen peaks surpassing 2,000ft. Some 22 miles north of Newcastle, the Legannany Dolmen s one of the finest and most photographed ancient sites in the country", "pages": "296", "coordinates": [54.15385476129891, -6.0631850276954244], "image": "https://commons.wikimedia.org/wiki/Special:FilePath/Mourne%20mountains.jpg?width=600"}];
 const map=map_a1fc62cb209d6e9fe622177c6724cfe7;
 const cluster=marker_cluster_5ec83d1dfe8a658fc22afe93791c9a20;
 const selected=new Set(['both','ben','cass','neither']);
 const colors={both:'#26936e',ben:'#e5ae2b',cass:'#448ed8',neither:'#777'};
 const search=document.getElementById('trip-search');
 const categories=document.getElementById('trip-category');
 const count=document.getElementById('trip-count');
 const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const imageSearch=(p)=>'https://www.google.com/search?'+new URLSearchParams({tbm:'isch',q:p.name+' '+p.county+' Ireland'}).toString();
 const allCats=[...new Set(places.flatMap(p=>p.categories))].sort((a,b)=>a.localeCompare(b));
 for(const cat of allCats){const option=document.createElement('option');option.value=cat;option.textContent=cat;categories.appendChild(option)}
 function popup(p){
    const photoLink=imageSearch(p);
    const fallback='<div class="trip-photo-fallback"><a target="_blank" rel="noopener noreferrer" href="'+escapeHTML(photoLink)+'">Search for photos ↗</a></div>';
    const img=p.image?'<img loading="lazy" alt="'+escapeHTML(p.name)+'" src="'+escapeHTML(p.image)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'+
       '<div style="display:none" class="trip-photo-fallback"><a target="_blank" rel="noopener noreferrer" href="'+escapeHTML(photoLink)+'">Photo unavailable — find another ↗</a></div>':fallback;
    const labels={both:'Ben + Cass',ben:'Ben',cass:'Cass',neither:'Not flagged'};
    return '<div class="trip-popup">'+img+'<h3>'+escapeHTML(p.name)+'</h3><p class="trip-meta">'+escapeHTML(p.county)+(p.pages?' · Book page '+escapeHTML(p.pages):'')+'</p>'+
       '<div class="trip-pills"><span class="trip-pill">'+escapeHTML(labels[p.person])+'</span>'+p.categories.map(x=>'<span class="trip-pill">'+escapeHTML(x)+'</span>').join('')+'</div>'+
       (p.description?'<p class="trip-description">'+escapeHTML(p.description)+'</p>':'')+
       '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.coordinates[0]+','+p.coordinates[1])+'" target="_blank" rel="noopener noreferrer">Open in Google Maps ↗</a></div>';
 }
 for(const p of places){
    const color=colors[p.person];
    const icon=L.divIcon({className:'',html:'<div class="pin" style="background:'+color+'"></div>',iconSize:[21,21],iconAnchor:[10,10]});
    p.marker=L.marker(p.coordinates,{icon,title:p.name});
    p.marker.bindPopup(()=>popup(p),{maxWidth:320});
 }
 let visible=[];
 function filter(){
    const q=search.value.trim().toLowerCase(),category=categories.value;
    visible=places.filter(p=>selected.has(p.person)&&(!category||p.categories.includes(category))&&
     (!q||[p.name,p.county,p.description,p.categories.join(' ')].join(' ').toLowerCase().includes(q)));
    cluster.clearLayers();
    cluster.addLayers(visible.map(p=>p.marker));
    count.textContent=visible.length+' of '+places.length+' attractions';
 }
 function fit(items){
    if(!items.length)return;
    const bounds=L.latLngBounds(items.map(p=>p.coordinates));
    map.fitBounds(bounds.pad(.08),{maxZoom:9});
 }
 search.addEventListener('input',filter);
 categories.addEventListener('change',filter);
 document.querySelectorAll('.person-filter').forEach(el=>el.addEventListener('change',()=>{if(el.checked)selected.add(el.value);else selected.delete(el.value);filter()}));
 document.getElementById('trip-fit').addEventListener('click',()=>fit(visible));
 document.getElementById('trip-reset').addEventListener('click',()=>{
    search.value='';categories.value='';document.querySelectorAll('.person-filter').forEach(el=>el.checked=true);
    selected.clear();['both','ben','cass','neither'].forEach(p=>selected.add(p));filter();fit(visible);
 });
 const toggle=document.getElementById('trip-toggle'),panel=document.getElementById('trip-panel');
 function setPanelCollapsed(collapsed){
    panel.classList.toggle('collapsed',collapsed);
    toggle.textContent=collapsed?'+':'−';
    toggle.setAttribute('aria-expanded',String(!collapsed));
    toggle.setAttribute('aria-label',collapsed?'Open map filters':'Close map filters');
 }
 toggle.addEventListener('click',()=>setPanelCollapsed(!panel.classList.contains('collapsed')));
 map.on('popupopen',()=>{if(window.matchMedia('(max-width:600px)').matches)setPanelCollapsed(true)});
 document.getElementById('trip-fit').addEventListener('click',()=>{if(window.matchMedia('(max-width:600px)').matches)setPanelCollapsed(true)});
 filter();fit(visible);
 if(window.matchMedia('(max-width:600px)').matches){setPanelCollapsed(true)}
})();

</script>
</html>
